services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      USE_SQLITE: "1"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      USE_SQLITE: "1"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - .:/app
    command: ["celery", "-A", "bookcollection", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
